# DY 구매팀 가격 리포트(0084) — 하루 2번 자동 + 화면 «지금 업데이트»
#
# 결과는 저장소에 커밋하지 않는다 — Supabase RPC(AI Agent 로그인, service_role 아님)로만 저장한다.
# 화면: /purchasing/biz_dy/price-report
#
# 필요한 Secrets(Settings > Secrets and variables > Actions — 이름만, 값은 대표가 넣는다):
#   ANTHROPIC_API_KEY   Vercel의 그 값(같은 키 재사용)
#   SUPABASE_URL        Vercel의 NEXT_PUBLIC_SUPABASE_URL 값
#   SUPABASE_ANON_KEY   Vercel의 NEXT_PUBLIC_SUPABASE_ANON_KEY 값
#   AI_AGENT_EMAIL      Vercel의 AI_AGENT_EMAIL(야간 브리핑 로그인) 값
#   AI_AGENT_PASSWORD   Vercel의 AI_AGENT_PASSWORD 값
# 선택 Variables: BRIEFING_MODEL(기본 claude-sonnet-5-5) · BRIEFING_MAX_SEARCHES(기본 15) · BRIEFING_FETCH_MAX_TOKENS(기본 없음)
#                 · BRIEFING_SOURCES_OFF(te = TradingEconomics 안 열기)
# 절차: docs/onboarding/release-price-report.md
name: Macro briefing (08:00 / 18:00 KST)

on:
  schedule:
    - cron: "0 23 * * *"   # 08:00 KST (UTC 전날 23:00)
    - cron: "0 9 * * *"    # 18:00 KST (UTC 09:00)
  workflow_dispatch:        # 화면 «지금 업데이트»(앱이 GitHub API로 부른다) · Actions 탭에서 손으로
    inputs:
      run_id:
        description: "실행 기록 id(«지금 업데이트»가 만든 것 — 손으로 돌릴 때는 비움)"
        required: false
        default: ""
      slot:
        description: "회차 — manual(수동) · 비우면 시각으로 AM/PM"
        required: false
        default: ""

# 저장소에 쓰지 않는다.
permissions:
  contents: read

# 같은 시각에 두 번 돌지 않게 — 앞 실행이 돌고 있으면 다음 것은 기다린다(취소하지 않는다).
# 버튼 실행은 DB가 «수집 중»이면 잠그므로(price_report_busy) 여기서 기다리는 것은 자동 회차와 겹칠 때뿐이다.
concurrency:
  group: macro-briefing
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: macro/engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run briefing → Supabase
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AI_AGENT_EMAIL: ${{ secrets.AI_AGENT_EMAIL }}
          AI_AGENT_PASSWORD: ${{ secrets.AI_AGENT_PASSWORD }}
          BRIEFING_MODEL: ${{ vars.BRIEFING_MODEL }}
          BRIEFING_MAX_SEARCHES: ${{ vars.BRIEFING_MAX_SEARCHES }}
          BRIEFING_FETCH_MAX_TOKENS: ${{ vars.BRIEFING_FETCH_MAX_TOKENS }}
          BRIEFING_SOURCES_OFF: ${{ vars.BRIEFING_SOURCES_OFF }}
          RUN_ID: ${{ github.event.inputs.run_id }}
          SLOT: ${{ github.event.inputs.slot }}
          TZ: Asia/Seoul
        run: |
          set -euo pipefail
          args=(--supabase)
          if [ -n "${RUN_ID:-}" ]; then args+=(--run-id "$RUN_ID"); fi
          if [ -n "${SLOT:-}" ]; then args+=(--slot "$SLOT"); fi
          python run.py "${args[@]}"
